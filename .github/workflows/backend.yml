name: backend

# 백엔드가 바뀐 PR에서만 돈다 (모노레포라 프론트만 고친 PR에서 굳이 돌릴 이유가 없다).
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 테스트가 실제 DB를 필요로 한다. application.yml이 localhost:5433을 보고 있으므로
      # 포트를 5433으로 맞춰서 설정 변경 없이 그대로 붙게 한다.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 빌드 및 테스트
        working-directory: backend
        run: ./gradlew build --no-daemon

      # 실패했을 때 어느 테스트가 왜 깨졌는지 봐야 하므로 리포트를 남긴다.
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
