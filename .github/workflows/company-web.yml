name: company-web

on:
  pull_request:
    paths:
      - "company-web/**"
      - ".github/workflows/company-web.yml"
  push:
    branches: [develop, main]
    paths:
      - "company-web/**"
      - ".github/workflows/company-web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: company-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package-lock.json이 npm 11로 생성돼서 npm 10(Node 20·22)에서는
          # `npm ci`가 의존성 트리를 다르게 계산해 실패한다. npm 11이 들어있는 24로 맞춘다.
          node-version: "24"
          cache: npm
          cache-dependency-path: company-web/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        # CRA는 CI=true면 경고도 에러로 처리한다. 기존 경고 때문에 바로 빨개지는 걸 피하려고
        # 우선 꺼둔다. 경고를 정리한 뒤 이 줄을 지우면 경고까지 잡아준다.
        env:
          CI: false
        run: npm run build
