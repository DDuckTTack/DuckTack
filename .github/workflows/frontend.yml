name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npx tsc --noEmit

      # lint는 아직 기존 코드에 걸리는 규칙이 있을 수 있어 우선 경고만 남긴다.
      # 정리가 끝나면 continue-on-error를 지워서 실패하도록 바꾸면 된다.
      - name: 린트
        run: npx expo lint
        continue-on-error: true
