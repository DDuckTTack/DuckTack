<svg xmlns="http://www.w3.org/2000/svg" width="680" height="512" viewBox="0 0 680 512" role="img">
<title>DuckTack 시스템 구조도</title>
<desc>모바일 앱과 관리자·제휴업체 웹이 Spring Boot 백엔드에 연결되고, 백엔드가 주요 서비스를 통해 PostgreSQL에 저장하며 업로드 이미지와 PDF 리포트는 파일 저장소에, 하자 탐지와 DIY 가이드 생성은 외부 Gemini API 호출로 처리된다.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
