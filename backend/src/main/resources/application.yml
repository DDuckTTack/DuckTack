server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 120MB
    max-http-form-post-size: 120MB

spring:
  # 로컬 개발용 설정은 backend/.env 에서 읽는다 (git 추적 제외).
  # 파일이 없으면 무시되고, 배포 환경에서는 실제 환경변수가 우선 적용된다.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/appdb}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppass}
    hikari:
      maximum-pool-size: 10

  servlet:
    multipart:
      enabled: true
      max-file-size: 80MB
      max-request-size: 120MB

  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      # 최초 배포 때는 update 로 스키마를 만들고, 그 뒤엔 JPA_DDL_AUTO=validate 로 고정할 것.
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    issuer: backend1-core
    # 기본값 없음 — 미주입 시 기동 실패한다(운영에서 약한 시크릿으로 뜨는 사고 방지).
    #   생성: openssl rand -base64 48
    secret: ${JWT_SECRET}
    access-token-minutes: 120

  email:
    from: ${MAIL_FROM:limseeun566@gmail.com}
    verification:
      ttl-minutes: 10

  cors:
    # 운영에서는 실제 도메인만. "*" 로 두지 말 것.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  refresh:
    days: 30
    pepper: ${REFRESH_PEPPER}

upload:
  max-files: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}

ai:
  base-url: ${AI_BASE_URL:https://frostily-sworn-shifting.ngrok-free.dev}
  retry:
    max-attempts: 3
    delay-ms: 300
    multiplier: 2.0

# ⭐ GCP 에 배포된 YOLO 객체 탐지 서버 — AI 팀원이 알려주는 실제 URL 로 교체
#    인증이 걸려 있으면 yolo.api-key 에 토큰 주입 (yolo-server 가 Authorization: Bearer <key> 검증)
#    multipart-field 는 YOLO 측에서 수신할 form 필드 이름 (default: image)
yolo:
  base-url: ${YOLO_BASE_URL:https://frostily-sworn-shifting.ngrok-free.dev}

moderation:
  enabled: ${MODERATION_ENABLED:true}
  fail-open: ${MODERATION_FAIL_OPEN:true}
  base-url: ${MODERATION_BASE_URL:http://moderation-server:5000}
  path: /moderate
  api-key: ${YOLO_API_KEY:}
  multipart-field: ${YOLO_MULTIPART_FIELD:image}

# ⭐ LLM (DIY 가이드 + 자재 추천 생성)
#    OpenAI 호환 API 기준 — 공급자만 다를 뿐 동일 코드로 호출.
#
#    [현재 기본값: Google Gemini 무료 티어]
#      base-url : https://generativelanguage.googleapis.com/v1beta/openai
#      model    : gemini-2.5-flash  (gemini-2.5-pro, gemini-flash-latest 도 가능)
#      api-key  : https://aistudio.google.com/apikey 에서 발급 (무료, 카드등록 X)
#      한도     : 일 1500건, 분당 15건  → 졸프 데모/테스트엔 충분
#
#    [OpenAI 로 갈아끼고 싶으면]
#      LLM_BASE_URL=https://api.openai.com/v1
#      LLM_MODEL=gpt-4o-mini
#      LLM_API_KEY=sk-proj-...
#
#    api-key 는 절대 yml/git 에 박지 말고 LLM_API_KEY 환경변수로 주입.
llm:
  base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gemini-2.5-flash}
  temperature: 0.3
  max-tokens: ${LLM_MAX_TOKENS:2000}

storage:
  local:
    root: ./storage
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

report:
  share:
    minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true


# 네이버 NCP Geocoding — 주소를 위경도로 변환 (관리자가 제휴업체를 주소로 등록할 때 사용).
#   업체 "검색" 은 카카오 로컬 API 로 이미 이전됐다. 네이버 지역검색 키는 더 이상 쓰지 않는다.
#   키 발급: https://console.ncloud.com  (Maps > Geocoding)
naver:
  api:
    ncp-client-id: ${NAVER_NCP_CLIENT_ID}
    ncp-client-secret: ${NAVER_NCP_CLIENT_SECRET}
    geocode-url: ${NAVER_GEOCODE_URL:https://naveropenapi.apigw.ntruss.com/map-geocode/v2/geocode}

# 카카오 로컬 API — 업체 키워드 검색.
#   기본값 없음 — 미주입 시 기동 실패한다.
kakao:
  api:
    rest-key: ${KAKAO_REST_KEY}
    local-url: https://dapi.kakao.com/v2/local/search/keyword.json
